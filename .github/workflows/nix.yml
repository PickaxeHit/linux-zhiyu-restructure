name: Nix build

# Builds the boot chain from the Nix definitions in this repository, natively
# on an aarch64 runner. The NixOS system configuration is not built here: it
# needs the full (large) stock closure, which is a separate, user-side build.

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Nix build jobs
        default: "4"
        type: string

permissions:
  contents: write

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Checkout linux-zhiyu
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = ${{ inputs.jobs }}
            cores = 4
            extra-substituters = https://raw.githubusercontent.com/PickaxeHit/linux-zhiyu-restructure/nix-repodata
            extra-trusted-public-keys = zhiyu-cache-1:bI3q/LSJTidQCaNFmF8hpa9egw4SeNQ/vU0BJpW+kqo=

      - name: Restore Nix store cache
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate the sources lock
        run: python3 scripts/gen-sources-lock.py --check

      - name: Materialize the nix-stable tree
        run: scripts/make-nix-stable.sh "$RUNNER_TEMP/nix-stable"

      - name: Check the NixOS configuration uses the cached packages
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nix-stable"
          sys() {
            nix eval --raw --impure --expr \
              "let f = builtins.getFlake \"path:$root\"; in f.nixosConfigurations.zhiyu.$1"
          }
          for pair in \
            "config.boot.kernelPackages.kernel.outPath:kernel" \
            "config.system.build.zhiyuInitramfs.outPath:initramfs" \
            "config.system.build.zhiyuFirmware.outPath:firmware"; do
            attr=${pair%%:*}
            pkg=${pair##*:}
            a=$(sys "$attr")
            b=$(nix eval --raw "$root#packages.aarch64-linux.$pkg.outPath" 2>/dev/null ||
                nix eval --raw "$root#$pkg.outPath")
            test "$a" = "$b" || {
              echo "::error::$pkg differs between the NixOS configuration ($a) and the flake ($b)" >&2
              exit 1
            }
          done
          # The images embed the system's own command line, so they are only
          # evaluated here (and cached per generation, not in the release).
          sys config.system.build.zhiyuImages.drvPath >/dev/null
          echo "NixOS configuration matches the cached kernel/initramfs/firmware"

      - name: Build images and flasher
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nix-stable"
          nix build "$root#zhiyu-images" --out-link result-images --print-out-paths
          nix build "$root#zhiyu-install" --out-link result-install --print-out-paths
          mkdir -p dist
          cp -aL result-images/*.img dist/
          sha256sum dist/*.img > dist/SHA256SUMS
          ls -l dist

      - name: Build cache targets
        env:
          NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p cache
          root="$RUNNER_TEMP/nix-stable"
          paths=$(nix build \
            "$root#kernel^*" "$root#initramfs" "$root#keymint" \
            "$root#firmware" "$root#dts" "$root#libcamera-zhiyu" \
            "$root#zhiyu-install" "$root#sensh" "$root#sensord" \
            "$root#qcomVaDriver" "$root#qcomSensors" \
            "$root#zhiyu-ucm2" "$root#udevRules" "$root#zhiyu-images" \
            --print-out-paths)
          : "${NIX_CACHE_PRIVATE_KEY:?NIX_CACHE_PRIVATE_KEY must be set: refusing to publish an unsigned cache}"
          printf '%s' "$NIX_CACHE_PRIVATE_KEY" > "$RUNNER_TEMP/cache.key"
          chmod 600 "$RUNNER_TEMP/cache.key"
          nix store sign --key-file "$RUNNER_TEMP/cache.key" -r $paths
          rm -f "$RUNNER_TEMP/cache.key"
          nix copy --to "file://$PWD/cache" $paths
          du -sh cache
          ls cache/nar | wc -l

      - name: Publish the Nix cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-nix-cache.sh cache "nix-cache-${{ github.run_id }}"

      - name: Update the nix-stable branch
        run: scripts/make-nix-stable.sh "$RUNNER_TEMP/nix-stable" --push

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: nix-images
          path: dist/
          if-no-files-found: error
