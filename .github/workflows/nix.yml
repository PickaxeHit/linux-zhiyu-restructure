name: Nix build

# Builds the boot chain from the Nix definitions in this repository, natively
# on an aarch64 runner. The NixOS system configuration is not built here: it
# needs the full (large) stock closure, which is a separate, user-side build.

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Nix build jobs
        default: "4"
        type: string

permissions:
  contents: write

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Checkout linux-zhiyu
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = ${{ inputs.jobs }}
            cores = 4

      - name: Restore Nix store cache
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Publish the firmware blob archive if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-firmware-blobs.sh

      - name: Validate the sources lock
        run: python3 scripts/gen-sources-lock.py --check

      - name: Build images and flasher
        run: |
          set -euo pipefail
          nix build .#zhiyu-images --out-link result-images --print-out-paths
          nix build .#zhiyu-install --out-link result-install --print-out-paths
          mkdir -p dist
          cp -aL result-images/*.img dist/
          sha256sum dist/*.img > dist/SHA256SUMS
          ls -l dist

      - name: Build cache targets
        env:
          NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p cache
          paths=$(nix build \
            .#kernel .#initramfs .#keymint .#firmware .#dts \
            .#libcamera-zhiyu .#zhiyu-install .#sensh .#sensord \
            .#qcomVaDriver .#qcomSensors .#zhiyu-ucm2 .#udevRules \
            .#zhiyu-images \
            --print-out-paths)
          if [ -n "${NIX_CACHE_PRIVATE_KEY:-}" ]; then
            printf '%s' "$NIX_CACHE_PRIVATE_KEY" > "$RUNNER_TEMP/cache.key"
            nix store sign --key-file "$RUNNER_TEMP/cache.key" -r $paths
          else
            echo "::warning::NIX_CACHE_PRIVATE_KEY is not set; the cache will be unsigned"
          fi
          nix copy --to "file://$PWD/cache" $paths
          du -sh cache
          ls cache/nar | wc -l

      - name: Publish the Nix cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-nix-cache.sh cache "nix-cache-${{ github.run_id }}"

      - name: Update the nix-stable branch
        run: scripts/make-nix-stable.sh

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: nix-images
          path: dist/
          if-no-files-found: error
